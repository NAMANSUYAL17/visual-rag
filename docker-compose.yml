version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/chroma_data:/app/chroma_data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend